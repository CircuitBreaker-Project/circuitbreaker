services:

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: "8761"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - circuit-breaker-network


  microservice-1:
    build:
      context: ./microservices
      dockerfile: Dockerfile
      args:
        MAIN_CLASS: com.circuitbreaker.microservice.Microservice1Application
    container_name: microservice-1
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      SERVER_PORT: "8081"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - circuit-breaker-network


  microservice-2:
    build:
      context: ./microservices
      dockerfile: Dockerfile
      args:
        MAIN_CLASS: com.circuitbreaker.microservice.Microservice2Application
    container_name: microservice-2
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      SERVER_PORT: "8082"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - circuit-breaker-network


  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
      microservice-1:
        condition: service_started
      microservice-2:
        condition: service_started
      zipkin:
        condition: service_started
    environment:
      SERVER_PORT: "8989"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8090:8989"
    restart: unless-stopped
    networks:
      - circuit-breaker-network


  react-dashboard:
    build:
      context: ./react-dashboard
      dockerfile: Dockerfile
    container_name: react-dashboard
    depends_on:
      api-gateway:
        condition: service_started
      zipkin:
        condition: service_started
    ports:
      - "3090:3000"
    restart: unless-stopped
    networks:
      - circuit-breaker-network


  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    environment:
      STORAGE_TYPE: mem
    ports:
      - "9411:9411"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:9411/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - circuit-breaker-network


networks:
  circuit-breaker-network:
    driver: bridge