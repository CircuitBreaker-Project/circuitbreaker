server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          # ==================================================
          # GATEWAY ROUTES
          # ==================================================

          routes:

            # ==================================================
            # PRODUCT SERVICE
            # ==================================================

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/products/**

            # ==================================================
            # INVENTORY SERVICE
            # ==================================================

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/inventory/**

            # ==================================================
            # RECOMMENDATION SERVICE
            # ==================================================
            # Member 1 resilience features are applied here:
            # Retry + Rate Limiter + Bulkhead + Circuit Breaker
            # ==================================================

            - id: recommendation-service
              uri: lb://recommendation-service

              predicates:
                - Path=/recommendations/**

              filters:

                # ------------------------------------------------
                # RETRY
                # ------------------------------------------------
                # Retry GET requests up to 3 times when the
                # downstream service returns a temporary error.
                # ------------------------------------------------

                - name: Retry
                  args:
                    retries: 3
                    methods:
                      - GET
                    statuses:
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT

                # ------------------------------------------------
                # RATE LIMITER
                # ------------------------------------------------
                # Capacity = 10 requests
                # Refill = 5 requests per second
                # ------------------------------------------------

                - name: InMemoryRateLimit
                  args:
                    capacity: 10
                    refillPerSecond: 5

                # ------------------------------------------------
                # BULKHEAD
                # ------------------------------------------------
                # Maximum 5 concurrent Recommendation requests.
                # ------------------------------------------------

                - name: Bulkhead
                  args:
                    name: recommendationBulkhead

                # ------------------------------------------------
                # CIRCUIT BREAKER
                # ------------------------------------------------

                - name: CircuitBreaker
                  args:
                    name: recommendationServiceCircuitBreaker
                    fallbackUri: forward:/fallback/recommendation
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

          # ==================================================
          # DEFAULT FILTERS
          # ==================================================

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

    # ========================================================
    # LOAD BALANCER
    # ========================================================

    loadbalancer:
      ribbon:
        enabled: false


# ============================================================
# EUREKA SERVICE DISCOVERY
# ============================================================
# Eureka implementation is owned by Member 4.
# Gateway uses Eureka for lb:// service discovery.
# ============================================================

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


# ============================================================
# RESILIENCE4J
# ============================================================

resilience4j:

  # ==========================================================
  # CIRCUIT BREAKER
  # ==========================================================

  circuitbreaker:
    instances:

      recommendationServiceCircuitBreaker:

        # Expose Circuit Breaker health through Actuator
        registerHealthIndicator: true

        # Count-based sliding window
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10

        # Circuit evaluation starts after at least 5 calls
        minimumNumberOfCalls: 5

        # Open when failure rate reaches 50%
        failureRateThreshold: 50

        # Stay OPEN for 10 seconds
        waitDurationInOpenState: 10s

        # Allow 3 trial calls in HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 3

        # Automatically move OPEN → HALF_OPEN
        automaticTransitionFromOpenToHalfOpenEnabled: true

  # ==========================================================
  # BULKHEAD
  # ==========================================================

  bulkhead:
    instances:

      recommendationBulkhead:

        # Only 5 calls can execute concurrently
        maxConcurrentCalls: 5

        # Do not wait for a free permit
        maxWaitDuration: 0ms

  # ==========================================================
  # TIME LIMITER
  # ==========================================================

  timelimiter:
    instances:

      recommendationServiceCircuitBreaker:

        # Maximum allowed execution time
        timeoutDuration: 3s


# ============================================================
# ACTUATOR
# ============================================================

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

  health:
    circuitbreakers:
      enabled: true


# ============================================================
# LOGGING
# ============================================================

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.netflix.eureka: INFO
    io.github.resilience4j: INFO