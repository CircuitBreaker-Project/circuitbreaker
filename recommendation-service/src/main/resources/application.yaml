server:
  port: 8083

spring:
  application:
    name: recommendation-service

  datasource:
    url: jdbc:h2:mem:recommendationdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/