server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: http://product-service:8081
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1

            - id: inventory-service
              uri: http://inventory-service:8082
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=1

            - id: recommendation-service
              uri: http://recommendation-service:8083
              predicates:
                - Path=/api/recommendations/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
